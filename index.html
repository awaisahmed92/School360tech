<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="School360tech — fees, staff, and academics. Work in progress." />
  <title>School360tech — Coming Soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='16' font-weight='700' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070d1c;
      --card: rgba(14, 24, 48, 0.86);
      --line: rgba(96, 165, 250, 0.28);
      --text: #f5f8ff;
      --muted: #a8b6d4;
      --accent: #60a5fa;
      --accent-2: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(37, 99, 235, 0.32), transparent 60%),
        radial-gradient(700px 420px at 100% 110%, rgba(99, 102, 241, 0.22), transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .wrap {
      width: min(720px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1d4ed8, #60a5fa);
      font-size: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 36px 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(37, 99, 235, 0.14);
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.7);
      animation: pulse 1.8s infinite;
    }

    h1 {
      margin: 22px 0 12px;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    h1 span { color: var(--accent-2); }

    p.lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      max-width: 280px;
      margin: 0 auto 10px;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1d4ed8, #93c5fd);
    }

    .status {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .chips span {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #dbe7ff;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover { text-decoration: underline; }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(96, 165, 250, 0); }
      100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
    }

    @media (max-width: 540px) {
      .card { padding: 36px 20px 28px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="mark">S</div>
      School360tech
    </div>

    <section class="card">
      <div class="badge"><span class="dot"></span> Work in progress</div>
      <h1>Coming <span>soon</span></h1>
      <p class="lead">Fees, staff, and academics in one school system. We are building School360tech and it will be live shortly.</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <p class="status">Building admissions, fees, and staff tools</p>
      <div class="chips">
        <span>Fees</span>
        <span>Staff</span>
        <span>Academics</span>
      </div>
    </section>

    <footer>
      A product of <a href="https://360techx.com">360techx</a>
      · <a href="mailto:contact@360techx.com">contact@360techx.com</a>
    </footer>
  </main>
</body>
</html>
